[workspace]
resolver = "2"
members = ["core/bardic-core", "core/bardic-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bardic-core = { path = "core/bardic-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
wiremock = "0.6"
